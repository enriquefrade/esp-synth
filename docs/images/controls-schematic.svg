<text x="30" y="380" text-anchor="start" font-family="Helvetica,Arial" font-size="14" font-weight="bold" fill="#1d3557">SYNC INPUT (external, 5 V signal)</text>
<rect x="15.0" y="404" width="150" height="34" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="2"/>
<text x="90.0" y="418.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#1d3557">5 V sync in</text>
<text x="90.0" y="434.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#457b9d">rising edge = trigger</text>
<line x1="165" y1="420" x2="180" y2="420" stroke="#1d3557" stroke-width="2.5"/>
<rect x="184" y="408" width="32" height="24" fill="#fff" stroke="#1d3557" stroke-width="2"/>
