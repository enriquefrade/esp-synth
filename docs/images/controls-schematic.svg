<text x="500" y="40" text-anchor="middle" font-family="Helvetica,Arial" font-size="22" font-weight="bold" fill="#1d3557">Controls schematic: buttons and sync input</text>
<text x="500" y="64" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#457b9d">Buttons are on the board (pull-ups R8, R17). Sync input needs the external circuit below.</text>
