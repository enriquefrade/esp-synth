<text x="500.0" y="418.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#1d3557">GPIO17 (SYNC)</text>
<text x="500.0" y="434.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#457b9d">header P1 pin 13</text>
<rect x="368" y="474" width="24" height="32" fill="#fff" stroke="#1d3557" stroke-width="2"/>
<text x="402" y="495" text-anchor="start" font-family="Helvetica,Arial" font-size="13" fill="#1d3557">20k</text>
<line x1="380" y1="420" x2="380" y2="474" stroke="#1d3557" stroke-width="2.5"/>
<line x1="380" y1="506" x2="380" y2="540" stroke="#1d3557" stroke-width="2.5"/>
<rect x="345.0" y="544" width="70" height="26" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="2"/>
<text x="380.0" y="562.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#1d3557">GND</text>
<line x1="380" y1="420" x2="380" y2="374" stroke="#1d3557" stroke-width="2.5"/>
<polygon points="370,374 390,374 380,358" fill="#1d3557"/>
<line x1="370" y1="356" x2="390" y2="356" stroke="#1d3557" stroke-width="3"/>
<line x1="380" y1="356" x2="380" y2="342" stroke="#1d3557" stroke-width="2.5"/>
<rect x="345.0" y="306" width="70" height="26" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="2"/>
<text x="380.0" y="324.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#1d3557">3V3</text>
<text x="402" y="366" text-anchor="start" font-family="Helvetica,Arial" font-size="12" fill="#457b9d">clamp diode (1N4148)</text>
<text x="500" y="620" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#457b9d">Divider: 1k, then 10k, then 20k to GND. At 5 V in, GPIO17 sees about 3.2 V (3.3 V max).</text>
<text x="500" y="640" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#457b9d">Clamp to 3V3 limits overshoot. Check the values on a bench before wiring a real 5 V source.</text>
<text x="500" y="660" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#457b9d">Pots: see pot-wiring.png.</text>
</svg>