<line x1="500" y1="680" x2="300" y2="680" stroke="#1d3557" stroke-width="2.5"/>
<text x="518" y="666" font-family="Helvetica,Arial" font-size="12" fill="#457b9d">100nF (optional)</text>
<text x="500" y="752" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#457b9d">GPIO1-3 are ADC1 inputs. Wire pots to the 3V3 rail only, never 5 V.</text>
