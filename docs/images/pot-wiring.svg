<line x1="500" y1="630" x2="585" y2="630" stroke="#e63946" stroke-width="2.5"/>
<circle cx="500" cy="630" r="4" fill="#1d3557"/>
<rect x="585.0" y="612" width="150" height="36" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="2"/><text x="660" y="630" text-anchor="middle" font-family="Helvetica,Arial" font-size="16" font-weight="bold" fill="#1d3557">GPIO3</text><text x="660" y="644" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#457b9d">P1 pin 11</text>
<line x1="500" y1="630" x2="500" y2="648" stroke="#1d3557" stroke-width="2.5"/>
<line x1="486" y1="648" x2="514" y2="648" stroke="#1d3557" stroke-width="3"/>
<line x1="486" y1="656" x2="514" y2="656" stroke="#1d3557" stroke-width="3"/>
