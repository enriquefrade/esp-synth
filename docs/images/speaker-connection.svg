<rect x="270" y="143" width="44" height="18" rx="0" fill="#fff" stroke="#1d3557" stroke-width="2"/>
<text x="292" y="138" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#457b9d">R48 0R</text>
<polyline points="314,152 470,152" fill="none" stroke="#1d3557" stroke-width="2.5"/>
<rect x="30" y="280" width="190" height="150" rx="6" fill="#fff" stroke="#1d3557" stroke-width="2.5"/>
<text x="125" y="310" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#1d3557">ES8311 codec</text>
<text x="125" y="330" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#457b9d">DAC outputs</text>
<text x="206" y="322" text-anchor="end" font-family="Helvetica,Arial" font-size="11" fill="#457b9d">OUTP</text>
<text x="206" y="392" text-anchor="end" font-family="Helvetica,Arial" font-size="11" fill="#457b9d">OUTN</text>
<polyline points="220,320 252,320" fill="none" stroke="#e63946" stroke-width="2.5"/>
<polyline points="256,313 256,327" fill="none" stroke="#1d3557" stroke-width="3"/>
<polyline points="284,313 284,327" fill="none" stroke="#1d3557" stroke-width="3"/>
<text x="270" y="306" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#457b9d">C78 0.1uF</text>
<rect x="318" y="311" width="44" height="18" rx="0" fill="#fff" stroke="#1d3557" stroke-width="2"/>
<text x="340" y="306" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#457b9d">R46 150K</text>
<polyline points="362,320 430,320 430,206 470,206" fill="none" stroke="#e63946" stroke-width="2.5"/>
<polyline points="220,392 252,392" fill="none" stroke="#e63946" stroke-width="2.5"/>
<polyline points="256,385 256,399" fill="none" stroke="#1d3557" stroke-width="3"/>
<polyline points="284,385 284,399" fill="none" stroke="#1d3557" stroke-width="3"/>
<text x="270" y="378" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#457b9d">C93 0.1uF</text>
<rect x="318" y="383" width="44" height="18" rx="0" fill="#fff" stroke="#1d3557" stroke-width="2"/>
<text x="340" y="378" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#457b9d">R47 150K</text>
<polyline points="362,392 446,392 446,266 470,266" fill="none" stroke="#e63946" stroke-width="2.5"/>
<rect x="470" y="110" width="250" height="200" rx="6" fill="#fff" stroke="#1d3557" stroke-width="2.5"/>
<text x="595" y="140" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#1d3557">NS4150B amplifier</text>
<text x="595" y="158" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#457b9d">class-D, U12</text>
<text x="486" y="156" text-anchor="start" font-family="Helvetica,Arial" font-size="12" fill="#457b9d">CTRL</text>
<text x="486" y="210" text-anchor="start" font-family="Helvetica,Arial" font-size="12" fill="#457b9d">IN+</text>
<text x="486" y="270" text-anchor="start" font-family="Helvetica,Arial" font-size="12" fill="#457b9d">IN-</text>
<text x="704" y="186" text-anchor="end" font-family="Helvetica,Arial" font-size="12" fill="#457b9d">OUT+</text>
<text x="704" y="296" text-anchor="end" font-family="Helvetica,Arial" font-size="12" fill="#457b9d">OUT-</text>
<polyline points="720,186 765,186 765,210 830,210" fill="none" stroke="#e63946" stroke-width="2.5"/>
<polyline points="720,296 765,296 765,260 830,260" fill="none" stroke="#e63946" stroke-width="2.5"/>
<rect x="830" y="150" width="110" height="160" rx="4" fill="#fff" stroke="#1d3557" stroke-width="2.5"/>
<text x="885" y="176" text-anchor="middle" font-family="Helvetica,Arial" font-size="16" font-weight="bold" fill="#1d3557">H2</text>
<text x="885" y="194" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#457b9d">PH2.0 (2-pin)</text>
<text x="850" y="214" text-anchor="start" font-family="Helvetica,Arial" font-size="14" fill="#e63946">1 +</text>
<text x="850" y="264" text-anchor="start" font-family="Helvetica,Arial" font-size="14" fill="#1d3557">2 -</text>
<polyline points="940,210 1000,210 1000,220" fill="none" stroke="#e63946" stroke-width="2.5"/>
<polyline points="940,260 1000,260 1000,250" fill="none" stroke="#1d3557" stroke-width="2.5"/>
<rect x="1000" y="170" width="160" height="110" rx="8" fill="#fdf6e3" stroke="#1d3557" stroke-width="2.5"/>
<text x="1080" y="200" text-anchor="middle" font-family="Helvetica,Arial" font-size="16" font-weight="bold" fill="#1d3557">Speaker</text>
<text x="1080" y="220" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#457b9d">4-8 ohm, about 1 W</text>
<text x="1080" y="260" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#457b9d">pin 1 to +, pin 2 to -</text>
<text x="600" y="560" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#457b9d">Firmware sets GPIO46 high after the codec opens (firmware/synth/audio.cpp).</text>
<text x="600" y="582" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#457b9d">The codec drives OUTP and OUTN into the amplifier through the coupling networks.</text>
<text x="600" y="604" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#457b9d">H2 pin 1 is the positive output (PA_OUTL+), pin 2 is negative (PA_OUTL-).</text>
<text x="600" y="626" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#457b9d">The schematic labels H2 as PH2.0 (2.0 mm pitch). Use a matching plug.</text>
<text x="600" y="648" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#457b9d">Full schematic crop: docs/images/speaker-schematic-crop.png</text>
</svg>