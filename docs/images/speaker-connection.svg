<text x="600" y="40" text-anchor="middle" font-family="Helvetica,Arial" font-size="22" font-weight="bold" fill="#1d3557">Speaker connection (H2)</text>
<text x="600" y="64" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#457b9d">Audio path from the codec to the speaker header, from the board schematic</text>
